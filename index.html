    <!-- Google Translate: loads hidden, controlled by our custom switcher -->
    <style>
      /* Hide Google's default UI completely — we use a custom dropdown */
      #google_translate_element, .goog-te-banner-frame, .skiptranslate { display: none !important; }
      body { top: 0 !important; }
      .goog-tooltip, .goog-tooltip:hover, .goog-text-highlight {
        background: transparent !important; box-shadow: none !important;
      }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,de,hi,nl,es,ja,zh-CN,ko,fr,it,tl,ar',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      defer></script>

  <body>
